name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Unit and integration tests
        working-directory: backend
        run: python -m pytest -m "not eval" -q

      # The eval suite runs the real pipeline over the actual spreadsheets and
      # asserts pinned metric values. A failure here means either the source
      # data moved or a metric regressed -- both worth blocking a merge for.
      - name: Golden-question evaluation suite
        working-directory: backend
        run: python -m pytest -m eval -q
