name: keep-warm

# Render's free tier sleeps a service after ~15 minutes idle and then takes
# 30-50s to wake. An evaluator opening the link cold reads that as "broken".
# A scheduled ping keeps it awake without paying for an always-on instance.
#
# GitHub's scheduler is best-effort and often runs late, so the interval is set
# tighter than the 15-minute sleep window to absorb the drift.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service
        run: |
          URL="https://skylark-monday-bi-agent-tply.onrender.com/api/health"
          # A cold start can take ~60s, so allow generously before calling it down.
          code=$(curl -s -o /tmp/body.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
          echo "HTTP $code"
          cat /tmp/body.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::warning::health check returned $code"
          fi
